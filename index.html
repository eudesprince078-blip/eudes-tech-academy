.shadow-2xl{

.shadow-sm{

}

.ring-2{

  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);

.ring-amber-400{

.ring-emerald-200{

.ring-slate-200{

:root {
  --bg: #06182e;
  --bg-2: #0a2547;
  --surface: #0d2f55;
  --surface-2: #123a66;
  --line: rgba(148, 197, 255, 0.18);
  --text: #f2f8ff;
  --muted: #b9cfe7;
  --muted-2: #89a7c5;
  --blue: #2ea5ff;
  --blue-2: #62c0ff;
  --orange: #ff7a1a;
  --orange-2: #ffb020;
  --green: #35d99a;
}

/* EUDES CENTRAL ACADEMY — Green + Yellow + White, fresh and kids-friendly */

[data-school="central"] {
  --bg: #f6fbf3;
  --bg-2: #e8f5e3;
  --surface: #ffffff;
  --surface-2: #eef8ec;
  --line: rgba(22, 163, 74, 0.22);
  --text: #12301a;
  --muted: #4a6b4f;
  --muted-2: #6b8a6f;
  --blue: #16a34a;
  --blue-2: #15803d;
  --orange: #facc15;
  --orange-2: #ca8a04;
  --green: #16a34a;
  --card: #ffffff;
  --ink: #12301a;
  --soft: #eef8ec;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #04101f;
    --bg-2: #071d38;
    --surface: #0b2747;
    --surface-2: #10365e;
    --card: #0e2f53;
    --ink: #f2f8ff;
    --soft: #0c2747;
    --muted: #c3d8ef;
  }

  [data-school="central"] {
    --bg: #f6fbf3;
    --bg-2: #e8f5e3;
    --surface: #ffffff;
    --surface-2: #eef8ec;
    --line: rgba(22, 163, 74, 0.22);
    --text: #12301a;
    --muted: #4a6b4f;
    --muted-2: #6b8a6f;
    --blue: #16a34a;
    --blue-2: #15803d;
    --orange: #facc15;
    --orange-2: #ca8a04;
    --green: #16a34a;
    --card: #ffffff;
    --ink: #12301a;
    --soft: #eef8ec;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

h1, h2, h3, .display {
  font-family: 'Space Grotesk', 'Manrope', system-ui, sans-serif;
}

::-moz-selection {
  background: var(--orange);
  color: white;
}

::selection {
  background: var(--orange);
  color: white;
}

input, select, textarea {
  font: inherit;
}

button {
  font: inherit;
}

.hero-grid {
  background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
  background-size: 42px 42px;
  -webkit-mask-image: radial-gradient(circle at 30% 20%, black 20%, transparent 78%);
          mask-image: radial-gradient(circle at 30% 20%, black 20%, transparent 78%);
}

.dot-grid {
  background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1px);
  background-size: 14px 14px;
}

.ring-shape {
  border: 2px solid rgba(255,122,26,.55);
}

input:focus, select:focus, textarea:focus {
  outline: 3px solid rgba(46,165,255,.45);
  outline-offset: 1px;
  border-color: var(--blue) !important;
}

.placeholder\:text-slate-400::-moz-placeholder{
  --tw-text-opacity: 1;
  color: rgb(148 163 184 / var(--tw-text-opacity, 1));
}

.placeholder\:text-slate-400::placeholder{
  --tw-text-opacity: 1;
  color: rgb(148 163 184 / var(--tw-text-opacity, 1));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-\[18px\]{
    font-size: 18px;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-end{
    align-items: flex-end;
  }

  .md\:items-center{
    align-items: center;
  }

  .md\:justify-between{
    justify-content: space-between;
  }
}

@media (min-width: 1024px){
  .lg\:max-w-none{
    max-width: none;
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.15fr_0\.85fr\]{
    grid-template-columns: 1.15fr 0.85fr;
  }

  .lg\:items-center{
    align-items: center;
  }
}

@media (min-width: 1280px){
  .xl\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

ames","Random files"],answer:0}]},a0={"ENG (English)":[{q:"Choose the noun: The teacher is under the mango tree.",options:["is","teacher","under","the"],answer:1},{q:"Choose the correct sentence.",options:["She go to school.","She goes to school.","She going school.","She goed school."],answer:1},{q:"The opposite of honest is…",options:["kind","dishonest","happy","brave"],answer:1},{q:"A word that names a person, place or thing is a…",options:["verb","noun","adjective","adverb"],answer:1},{q:"Past tense of go is…",options:["goed","went","gone to","going"],answer:1}],"MTC (Mathematics)":[{q:"Work out: 1/2 + 1/4",options:["1/6","3/4","1/8","2/6"],answer:1},{q:"3/4 of 20 pupils walk to school. How many walk?",options:["5","10","15","20"],answer:2},{q:"What is 15% of 200?",options:["15","30","45","60"],answer:1},{q:"A mango costs 500 UGX. How much for 6?",options:["2,000","2,500","3,000","3,500"],answer:2},{q:"Half of 10 mangoes is…",options:["2","4","5","8"],answer:2}],"SCIE (Integrated Science)":[{q:"Which part of a plant drinks water?",options:["Leaf","Stem","Root","Flower"],answer:2},{q:"Plants make food using…",options:["Moonlight","Sunlight","Rain only","Soil only"],answer:1},{q:"Clean water helps us…",options:["Get sick","Stay healthy","Sleep less","Forget"],answer:1},{q:"Which is a living thing?",options:["Stone","Maize plant","Chair","Bottle"],answer:1},{q:"We wash hands to…",options:["Waste water","Remove germs","Get dirty","Play"],answer:1}],"SST (Social Studies)":[{q:"Uganda is in which continent?",options:["Asia","Africa","Europe","America"],answer:1},{q:"On a map, North is…",options:["Down","Up","Left","Right"],answer:1},{q:"Trade means…",options:["Buying and selling","Singing","Running","Sleeping"],answer:0},{q:"A leader who serves is…",options:["Selfish","Kind and honest","Rude","Lazy"],answer:1},{q:"We keep rivers clean by…",options:["Throwing rubbish","Not littering","Burning plastic","Ignoring"],answer:1}]},vm=[{id:"live1",course:"basics",topic:"Excel ding…":""]}),o("div",{className:"mt-2 flex flex-wrap gap-2",children:[!e?u("button",{type:"button",onClick:()=>{d(null),p(!1),i(0),t(!0)},className:"rounded-full bg-[var(--orange)] px-4 py-2 text-xs font-bold text-white",children:"Record Audio"}):u("button",{type:"button",onClick:()=>{t(!1),d(l)},className:"rounded-full bg-red-500 px-4 py-2 text-xs font-bold text-white",children:"Stop"}),f!==null&&o("button",{type:"button",onClick:()=>p((_)=>!_),className:"rounded-full bg-white px-4 py-2 text-xs font-bold text-[#0a2547]",children:[a?"Pause":"Play"," • ",g(f)]})]}),f!==null&&o("p",{className:"mt-2 rounded-xl bg-white/10 p-2 text-sm",children:["\uD83C\uDFA4 Audio message • ",g(f)," — ",a?"Playing…":"Paused"]}),u("p",{className:"mt-1 text-xs text-[var(--muted)]",children:"Simulated audio note — no microphone needed."})]})}function sc(n){let e=n.toLowerCase();if(e.includes("photoshop"))return"Photoshop step by step: 1) Open your photo. 2) Crop away what you do not need. 3) Fix light a little at a time. 4) Fix colour. 5) Save a small JPG for WhatsApp and keep the original. Example: crop a shop photo, brighten slightly, export clear.";if(e.includes("canva"))return"Canva: 1) Open Canva, choose a blank poster. 2) Add ONE big headline. 3) Add ONE photo. 4) Add date, price and contact. 5) Check on your phone, then download. Example: Fresh Bread — 5,000 UGX, photo, Order on WhatsApp.";if(e.includes("excel")||e.includes("budget"))return"Excel: 1) Items in column A, numbers in column B. 2) Click the empty cell under numbers. 3) Type =SUM(B2:B5) and press Enter. 4) Check with a calculator the first time. Example: bread 5,000 + sugar 4,000 + milk 3,000 = 12,000.";if(e.includes("html"))return"HTML gives a page structure: <h1> is the big title, <p> is normal text, <a> is a link, <img> shows a photo. Example: <h1>My Shop</h1> <p>We sell fresh bread every morning.</p> Type it, save as .html, open in your browser.";if(e.includes("css"))return"CSS makes a page look beautiful: colour, spacing, layout. HTML is structure, CSS is style. Example: h1 { color: blue; } makes your title blue. Change one thing at a time.";if(e.includes("javascript")||e.includes("button"))return"JavaScript makes a page do things on click. 1) Make a button in HTML. 2) Listen for the click. 3) Show a message or change a number. Start small: one button, one action.";if(e.includes("video")||e.includes("capcut")||e.includes("reel")||e.includes("edit"))return"Video: 1) Hook in first 2 seconds. 2) Film 3 short clips in daylight. 3) In CapCut cut pauses. 4) Add captions — many watch without sound. 5) Keep music low. Export vertical for TikTok / WhatsApp Status.";if(e.includes("marketing")||e.includes("sell")||e.includes("advert"))return"Marketing: 1) Who is your customer? 2) What problem do you solve? 3) Show proof — photo, happy customer. 4) Next step: Message us on WhatsApp. Example: Tired of slow computers? We fix them in one day. Message us today.";if(e.includes("repair")||e.includes("slow")||e.includes("virus"))return"Repair: 1) Write the symptom. 2) Check storage, startup apps, updates. 3) Try ONE fix, then test. 4) Back up before reinstalling. Never force a cover open; switch off and unplug first.";if(e.includes("fee")||e.includes("price")||e.includes("cost"))return"Tech fees: Computer Basics 150,000 UGX. Graphic Design, Video Editing, Digital Marketing and Computer Repair 250,000 UGX each. Web Design & Coding 350,000 UGX.";return"Great question! Break it into small steps: 1) What is the first tiny step? 2) Try that one step, then check. 3) If it works, do the next step. Practise the lesson example once slowly, then again a little faster. Ask me about Photoshop, Canva, Excel, HTML, CSS, video or marketing for a worked example."}function nh(n){let e=n.toLowerCase();if(e.includes("fraction"))return"\uD83C\uDF1F MTC — A fraction is a part of a whole, like sharing a mango. \uD83E\uDD6D One mango cut into 2 equal parts: each part is 1/2. Cut into 4: each part is 1/4. Mama has 4 oranges, she gives you 1 — you have 1/4. Try 1/2 + 1/4!";if(e.includes("noun"))return"\uD83C\uDF1F ENG — A noun is a naming word! Person: teacher, mama. Place: Kampala, school. Thing: mango, book, ball. Example: The teacher is under the mango tree. Your turn: name 3 nouns you can see! ⭐";if(e.includes("plant"))return"\uD83C\uDF31 SCIE — A plant has roots (drink water), stem (carries water up), leaves (make food with sunshine). A maize plant needs sun, water and good soil. Draw one plant and label root, stem, leaf! \uD83C\uDF89";if(e.includes("uganda")||e.includes("map")||e.includes("trade"))return"\uD83D\uDDFA️ SST — Uganda is our country in Africa. On a map, North is up. Trade means buying and selling. Keep our rivers clean. Greet elders. Know your village and district!";if(e.includes("add")||e.includes("plus")||e.includes("+"))return"\uD83D\uDD22 MTC — Addition puts things together! 3 mangoes + 2 mangoes = 5 mangoes. Count first group, count second group, count all together. Try 24 + 13 with bottle tops! ⭐";if(e.includes("ple"))return"\uD83C\uDFAF PLE — 4 papers: ENG, MTC, SCIE, SST. Read each question twice. Answer easy ones first. Show working in MTC. Breathe. Slow is smart. One question at a time. You are brave and ready! \uD83C\uDF1F";return"\uD83C\uDF1F Hello, superstar! I am Teacher Eudes AI in Kids Mode for ENG, MTC, SCIE and SST. I explain in very simple words, with Uganda examples: market, boda, mango tree. Tell me your subject — ENG, MTC, SCIE or SST — and your question, and we will solve it together! \uD83D\uDC9B"}function y0(){let[n,e]=h.useState(null),[t,l]=h.useState(null),[i,f]=h.useState("landing"),[d,a]=h.useState(!1),[p,g]=h.useState("Student"),[_,O]=h.useState("Director Eudes"),[E,V]=h.useState("director@eudes.edu"),[S,F]=h.useState("1234"),[I,k]=h.useState("p5"),[c,m]=h.useState(null),[z,H]=h.useState(null),[M,Y]=h.useState(!1),[U,q]=h.useState(null),X=(r,v)=>{let w=v||"tech";if(r==="Admin")return{name:"Director Eudes",email:"director@eudes.edu",
